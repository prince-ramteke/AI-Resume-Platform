# Grafana dashboard provider (v1.1 observability).
# Loads source-controlled dashboard JSON from the mounted directory at startup.
apiVersion: 1

providers:
  - name: resume-ai
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
