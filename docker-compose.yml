services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: resumeai
      POSTGRES_USER: ${DB_USER:-resumeai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-resumeai}"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/resumeai
      DB_USER: ${DB_USER:-resumeai}
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-replace-in-production-min-256-bits-long-string}
      OLLAMA_BASE_URL: http://ollama:11434
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FRONTEND_ORIGIN: http://localhost:5173
      # Phase 5 — transactional email & feature flags
      EMAIL_VERIFICATION_ENABLED: ${EMAIL_VERIFICATION_ENABLED:-false}
      NOTIFICATION_ENABLED: ${NOTIFICATION_ENABLED:-false}
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      # Brevo transactional email provider
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Resume Intelligence}
      BREVO_BASE_URL: ${BREVO_BASE_URL:-https://api.brevo.com}
      NOTIFICATION_ADMIN_EMAIL: ${NOTIFICATION_ADMIN_EMAIL:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      # Legacy Resend variables — kept until Brevo is confirmed in production
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_BASE_URL: ${RESEND_BASE_URL:-https://api.resend.com}
      NOTIFICATION_SENDER_ADDRESS: ${NOTIFICATION_SENDER_ADDRESS:-}
      # Persisted upload location; matches the named volume mounted below so
      # uploaded resumes/JDs survive container recreation (DB rows store paths).
      STORAGE_PATH: /app/uploads
      # Actuator/metrics run on a separate management port that is deliberately NOT
      # published in `ports:` below — Prometheus scrapes it over the internal network
      # only. Fixed to 9091 to match monitoring/prometheus.yml.
      MANAGEMENT_SERVER_PORT: 9091
    ports:
      # Only the application port is exposed to the host. 9091 (management) is intentionally omitted.
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  # --- Observability (v1.1). Scrapes the backend's unpublished management port (9091). ---
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      # Anonymous access disabled; admin password supplied via env (dev default only).
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

# No grafana-data volume by decision — dashboards are provisioned from source-controlled files.
volumes:
  pgdata:
  ollama:
  uploads:
