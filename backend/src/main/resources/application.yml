spring:
  application:
    name: resume-ai

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resumeai}
    username: ${DB_USER:resumeai}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Applied to the auto-configured RestClient.Builder used by the Ollama/OpenAI LLM and
  # embedding clients. Bounds indefinite hangs on a stalled provider; the read timeout is
  # generous because local model inference can take minutes.
  http:
    client:
      connect-timeout: ${HTTP_CONNECT_TIMEOUT:5s}
      read-timeout: ${HTTP_READ_TIMEOUT:300s}

server:
  port: 8080

management:
  # Actuator runs on a SEPARATE port (v1.1 observability, Option B). In Docker this port is
  # NOT published to the host — Prometheus scrapes it over the internal network only, so
  # /actuator/prometheus is never internet-exposed and needs no SecurityConfig change.
  server:
    port: ${MANAGEMENT_SERVER_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      # Publish histogram buckets for the analysis/LLM latency timers so Grafana can compute
      # p50/p95 via histogram_quantile(). Bounded, low-cardinality — only these two timers.
      percentiles-histogram:
        analysis.latency: true
        llm.latency: true
        rag.retrieval.latency: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-secret-replace-in-production-min-256-bits-long-string}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
    refresh-expiry-days: ${REFRESH_TOKEN_EXPIRY_DAYS:7}
  rate-limit:
    analysis:
      capacity: ${ANALYSIS_RATE_LIMIT_CAPACITY:5}
      refill-tokens: ${ANALYSIS_RATE_LIMIT_REFILL_TOKENS:5}
      refill-period: ${ANALYSIS_RATE_LIMIT_REFILL_PERIOD:15m}
  storage:
    path: ${STORAGE_PATH:./uploads}
  rag:
    chunk-size: ${RAG_CHUNK_SIZE:500}
    chunk-overlap: ${RAG_CHUNK_OVERLAP:50}
    retrieval-top-k: ${RAG_RETRIEVAL_TOP_K:8}
    max-prompt-tokens: ${LLM_MAX_PROMPT_TOKENS:3500}
    # Hybrid retrieval (v1.1/v1.2): blend vector similarity with PostgreSQL full-text keyword
    # search and fuse via Reciprocal Rank Fusion. Enabled by default (v1.2.M2 decision:
    # Recall@3 +13.33pp, MRR +23.89pp, zero regressions vs 15-case eval). Requires the V6
    # full-text index (shipped in v1.1). Disable with RAG_HYBRID_ENABLED=false if needed.
    hybrid-enabled: ${RAG_HYBRID_ENABLED:true}
    hybrid-rrf-k: ${RAG_HYBRID_RRF_K:60}                         # RRF damping constant (standard default 60)
    hybrid-candidate-pool-size: ${RAG_HYBRID_CANDIDATE_POOL_SIZE:20}  # candidates pulled per arm before fusion
    hybrid-keyword-term-limit: ${RAG_HYBRID_KEYWORD_TERM_LIMIT:5}     # max technical tokens passed to plainto_tsquery (v1.2.M2)
  embedding:
    provider: ${EMBEDDING_PROVIDER:ollama}
    dimensions: ${EMBEDDING_DIMENSIONS:768}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      model: ${OPENAI_EMBED_MODEL:text-embedding-3-small}
      api-key: ${OPENAI_API_KEY:}
    gemini:
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      model: ${GEMINI_EMBED_MODEL:gemini-embedding-2}
      api-key: ${GEMINI_API_KEY:}
  llm:
    provider: ${LLM_PROVIDER:ollama}
    temperature: ${LLM_TEMPERATURE:0.0}
    seed: ${LLM_SEED:42}
    fallback-enabled: ${LLM_FALLBACK_ENABLED:true}   # reserved for the resilience milestone; not yet wired
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_CHAT_MODEL:llama3.1:8b}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      api-key: ${OPENAI_API_KEY:}
  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:10}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
  feature:
    # All flags default to false. Local development works without any external dependencies.
    # Enable each flag independently in Render via the corresponding environment variable.
    email-verification-enabled: ${EMAIL_VERIFICATION_ENABLED:false}
    google-oauth-enabled: ${GOOGLE_OAUTH_ENABLED:false}
    notification-enabled: ${NOTIFICATION_ENABLED:false}
  notification:
    # Brevo transactional email — leave empty until the notification feature is enabled.
    # The notificationEnabled flag prevents outbound calls when these are unset.
    brevo-api-key: ${BREVO_API_KEY:}
    brevo-sender-email: ${BREVO_SENDER_EMAIL:}
    brevo-sender-name: ${BREVO_SENDER_NAME:Resume Intelligence}
    brevo-base-url: ${BREVO_BASE_URL:https://api.brevo.com}
    admin-email: ${NOTIFICATION_ADMIN_EMAIL:}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
